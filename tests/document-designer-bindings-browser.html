<!doctype html>
<html><head><meta charset="utf-8"><title>Print layer data connections</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#333}button,input,select,textarea{font:inherit}button{cursor:pointer;background:transparent;border:0}h1,h2,h3,p{margin:0}.fixture-button{border:1px solid #ddd;border-radius:5px;padding:7px 12px;font-size:12px;background:white}.fixture-button.primary{background:#f97316;color:white}.print-fixture{position:absolute;left:-10000px;top:0}#result{position:fixed;bottom:0;left:0;z-index:30000;background:white;font-size:10px}
</style></head><body><div id="app"></div><pre id="result">Running</pre><script type="module">

    await select(rowId);const sourceRow=document.querySelector(`[data-layer-node="${rowId}"] > .layer-row`),targetRow=document.querySelector(`[data-layer-node="${items}"] > .layer-row`),transfer=new DataTransfer();sourceRow.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:transfer}));targetRow.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));await wait();check(design.value.sections.find(s=>s.id===items).elements.find(e=>e.key===rowChild.key).parent==='item-details','Row binding escaped its repeating frame')
    await select(items+'::item-name');check(label('Link to data').disabled&&document.querySelector('.binding-help').textContent.includes('required'),'Required item name lost its source protection')

    await select(childId);label('Lock selected layer').click();await wait();check(label('Link to data').matches(':disabled'),'Locked layer data source remains editable');label('Unlock selected layer').click();await wait()

    await select(childId);for(const group of ['Position','Layout','Appearance','Typography','Fill','Stroke'])check(document.querySelector(`[aria-label="${group} properties"]`),'Missing quote '+group+' section');edit('Element font weight',500);edit('Element line height','150%');edit('Letter spacing unit','percent');edit('Element letter spacing',10);edit('Element fill hex','123456');edit('Fill opacity',50);await wait();let styled=element(childId,print()),css=getComputedStyle(styled);check(css.fontWeight==='500'&&css.color==='rgba(18, 52, 86, 0.5)'&&Math.abs(parseFloat(css.letterSpacing)-parseFloat(css.fontSize)*.1)<.05,'Quote DOM ignored typography or fill');label('Text resizing auto width').click();await wait();check(element(childId,print()).style.width==='max-content','Quote auto width was not rendered');const autoSnapshot=JSON.stringify(design.value.sections.find(s=>s.id===header).elements.find(e=>e.key===child.key));edit('Element width',Number(label('Element width').value)+2);await wait();await history('z');check(JSON.stringify(design.value.sections.find(s=>s.id===header).elements.find(e=>e.key===child.key))===autoSnapshot&&element(childId,print()).style.width==='max-content','Numeric resize did not undo geometry and auto sizing together');label('Text resizing fixed size').click();edit('Element height',20);await wait();label('Text vertical align bottom').click();await wait();check(getComputedStyle(element(childId,print())).justifyContent==='flex-end','Quote vertical alignment is not rendered');label('Flip horizontal').click();await wait();check(getComputedStyle(element(childId,print())).transform.includes('-1'),'Quote text flip is not rendered');label('Hide fill').click();await wait();check(getComputedStyle(element(childId,print())).color==='rgba(0, 0, 0, 0)','Quote fill visibility is not rendered');label('Show fill').click();button('Save design').click();await wait();check(normalizeQuoteDesign(saved).sections.some(s=>s.elements?.some(e=>e.fontWeight===500&&e.fill
