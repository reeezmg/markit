<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer notification controls</title></head><body><div id="app"></div><pre id="result">Running…</pre><script type="module">
import * as Vue from 'vue'
import Workspace from '../components/Connect/WhatsAppNotifications.vue'
import {normalizeNotificationRules,notificationEvents} from '../utils/whatsapp-notifications'
const {createApp,ref,nextTick,h}=Vue,requests=[],scope={busy:ref(false)}
const clone=value=>JSON.parse(JSON.stringify(value))
window.useCompanyScope=()=>scope
const settings={ready:true,enabled:false,rules:normalizeNotificationRules({})}
let clients=[{id:'client-a',name:'Alex Demo',phone:'9876543210'}],installations=[{id:'unit-a',reference:'PR-000001',name:'Demo purifier',client_name:'Alex Demo'}],queue=[]
window.$fetch=async(url,options={})=>{
 if(options.headers['x-company-id']!=='branch-company')throw Error('Selected company was lost')
 requests.push({url,...clone(options)});const action=url.split('/').pop(),method=options.method||'GET'
 if(action==='settings'){if(method==='PUT')Object.assign(settings,clone(options.body));return clone(settings)}
 if(action==='templates')return {data:[{id:'300',name:'customer_update',language:'en_US',status:'APPROVED',category:'UTILITY'},{id:'301',name:'feedback_update',language:'en_US',status:'APPROVED',category:'MARKETING'}],after:null}
 if(action==='queue')return clone(queue)
 if(action==='contacts'){if(method==='POST'){const b=options.body;Object.assign(clients[0],{recipient:b.recipient,service_consent:b.serviceConsent,marketing_consent:b.marketingConsent,evidence:b.evidence})}return clone(clients)}
 if(action==='installations'){if(method==='POST'){Object.assign(installations[0],{appointment_on:options.body.appointmentOn,technician:options.body.technician,status:options.body.status});return {saved:true}}return clone(installations)}
 if(action==='process'){queue=[{id:'queue-a',event_type:'service_completed',client_name:'Alex Demo',status:'ACCEPTED',delivery_status:'DELIVERED',available_at:new Date().toISOString(),meta_id:'wamid.example',recipient:'919876543210'}];return {queued:1}}
 throw Error('Unexpected request '+url)
}
const app=createApp({render:()=>h(Workspace,{companyId:'branch-company',connected:true})});app.config.errorHandler=e=>{document.querySelector('#result').textContent='FAILED: '+e.stack};app.mount('#app')
const pause=()=>new Promise(r=>setTimeout(r,30)),assert=(ok,message)=>{if(!ok)throw Error(message)}
async function until(predicate,label){for(let i=0;i<150;i++){await nextTick();if(predicate())return;await pause()}throw Error(label)}
const button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text)
async function click(text){await until(()=>button(text)&&!button(text).disabled,'Button '+text);button(text).click();await pause()}
function input(label){return [...document.querySelectorAll('label')].find(l=>l.textContent.trim().startsWith(label))?.querySelector('input,textarea,select')}
function set(el,value){assert(el,'Input missing');el.value=value;el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}))}
try{
 await until(()=>document.querySelector('[aria-label="Default update template"]'),'Settings loaded')
 assert(document.querySelectorAll('input[type=checkbox]').length===notificationEvents.length+1,'Every event is configurable')
 set(document.querySelector('[aria-label="Default update template"]'),'300');set(document.querySelector('[aria-label="Service feedback request template"]'),'301')
 input('Enable automatic').click();await nextTick();await click('Save notifications')
 const saved=requests.find(r=>r.url.endsWith('/settings')&&r.method==='PUT');assert(saved,'Settings request missing: '+JSON.stringify(requests));assert(saved.body.enabled&&saved.body.rules.sale_created.templateId==='300'&&saved.body.rules.feedback.templateId==='301','Rules and templates persist')
 await click('Client permissions');await click('Edit permissions');set(input('WhatsApp number'),'919876543210');input('Client permits purchase').click();set(input('Permission record'),'Client requested service updates at the counter.');await nextTick();await click('Save client permissions')
 const consent=requests.find(r=>r.url.endsWith('/contacts')&&r.method==='POST');assert(consent,'Permission request missing: '+JSON.stringify(requests));assert(consent.body.serviceConsent&&!consent.body.marketingConsent,'Service permission does not silently enable marketing')
 await click('Installation appointments');await click('Book / reschedule');set(input('Installation date'),'2027-01-05T10:30');set(input('Technician'),'Alex Technician');await nextTick();await click('Save installation appointment');assert(requests.some(r=>r.url.endsWith('/installations')&&r.body?.technician==='Alex Technician'),'Installation appointment saved')
 await click('Cancel appointment');assert(requests.some(r=>r.url.endsWith('/installations')&&r.body?.status==='CANCELLED'),'Cancellation persisted')
 await click('Delivery activity');await click('Process notifications now');await until(()=>document.body.textContent.includes('DELIVERED'),'Webhook delivery state shown');assert(document.body.textContent.includes('wamid.example'),'Message ID shown')
 assert(!scope.busy.value,'Company scope unlocks when actions finish')
 document.querySelector('#result').textContent='ALL PASSED: event settings, templates, client permissions, installations, cancellation and delivery activity'
}catch(e){document.querySelector('#result').textContent='FAILED: '+e.stack}
</script></body></html>
