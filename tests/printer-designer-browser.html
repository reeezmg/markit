  button('Save design').click();await wait(()=>document.querySelector('.inspector-save-state').textContent==='All changes saved');
  const legacyLabel=templateSchema.parse({id:'old-label',name:'Saved label',kind:'label',width:50,height:38,dpi:'203',fontFamily:'thermal',elements:[
    ['field','shopname','',1,5,11,true],['line','','',5,2,8,false],['field','productName','',7,3.5,8,false],['field','labelVariantSize','',11,3.5,8,false],
    ['field','sprice','MRP Rs.',15,3.5,8,false],['field','dprice','Discount Rs.',19,3.5,8,false],['field','code','',23,3,7,false],['barcode','barcode','',26,10,8,false],
  ].map(([type,field,text,y,height,fontSize,bold],index)=>({...newElement(type,50),id:'old-label-'+index,field,text,y,height,fontSize,bold,align:'left',...(field==='sprice'?{strikeThrough:'discount'}:field==='dprice'?{visibility:'discount'}:{})}))});
  record('company').templates.push(clone(legacyLabel));const writesBefore=calls.filter(c=>c.options.method==='PUT').length;
  await router.push('/print-design/label/'+legacyLabel.id+'?entryCompany=company');await wait(ready);
  check(liveDesign().fontFamily==='sans'&&liveDesign().elements.length===9&&liveDesign().elements.at(-1).field==='barcode','Old label did not refresh to ordinary Arial tools');
  check(record('company').templates.find(e=>e.id===legacyLabel.id).fontFamily==='thermal'&&calls.filter(c=>c.options.method==='PUT').length===writesBefore,'Opening label persisted its refresh without Save');
  await history('z');await wait(ready);check(liveDesign().fontFamily==='thermal'&&liveDesign().elements.length===8,'Label refresh is not one undoable change');
  await history('y');await wait(ready);check(liveDesign().fontFamily==='sans'&&liveDesign().elements.length===9,'Label refresh redo failed');
  button('Save design').click();await wait(()=>document.querySelector('.inspector-save-state').textContent==='All changes saved');
  check(record('company').templates.find(e=>e.id===legacyLabel.id).fontFamily==='sans','Refreshed label did not save');
  document.getElementById('result').textContent='ALL PASSED: routed label/receipt editor; shared canvas/layers/inspector; reference panels, weights, resizing, aspect lock and layered fills; existing/new links; custom fields; frames; movement/locks/cancel; undo/redo; defaults; failed saves; Back/discard/reopen; colour editing, visible Fill/Background/Stroke, empty GST backgrounds and accurate selections, chosen-font print geometry/PDF/TSPL/CPCL parity; receipt table sources/insertion/placement/spacing/visibility/sheet sizing; Codes insertion, formats, manual/linked values, locks and save/reopen; text prefix/suffix; company isolation; access and retry; clean Arial label refresh, explicit Save, Undo/Redo'
 }
}catch(error){document.getElementById('result').textContent='FAILED at '+phase+': '+error.stack}
</script></body></html>
