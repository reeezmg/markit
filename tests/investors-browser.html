<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor workflow UI check</title></head><body><div id="app"></div><pre id="result">RUNNING</pre>
<script type="module">

const {createApp,h,ref,reactive,nextTick}=Vue
Object.assign(window,{ref,reactive,computed:Vue.computed,watch:Vue.watch,onMounted:Vue.onMounted,nextTick})
const route=reactive({path:'/investments/investors',query:{},params:{}}),requests=[],errors=[],toasts=[]
window.testRoute=route;window.useRoute=()=>route
window.useAuth=()=>({session:ref({role:'manager',companyId:'a'})})
window.useToast=()=>({add:value=>toasts.push(value)})
window.navigateTo=async to=>{route.query=typeof to==='string'?{}:to.query||{};route.path=typeof to==='string'?to:to.path;route.params={investorId:route.path.split('/').at(-1)};await nextTick()}
async function request(method,path,body,options={}){
 const url=new URL('/fixture-api'+path,location.origin)
 for(const [key,value]of Object.entries(options.query||{}))url.searchParams.set(key,String(value))
 requests.push({method,path,body:body?JSON.parse(JSON.stringify(body)):undefined})
 const result=await fetch(url,{method,headers:{'content-type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})}),data=await result.json()
 if(!result.ok)throw Error(data.statusMessage||'Request failed')
 return data
}
window.useAccountantApi=()=>({companyId:ref('a'),get:(path,options)=>request('GET',path,undefined,options),post:(path,body)=>request('POST',path,body),put:(path,body)=>request('PUT',path,body),delete:path=>request('DELETE',path)})
window.useSelectedAccounts=()=>({get:()=>request('GET','/fixture-defaults')})
const app=createApp({render(){
 let component,props={key:route.path+JSON.stringify(route.query)}
 if(route.path==='/investments/investors')component=DirectoryPage
 else if(route.path.startsWith('/investments/investors/')){component=InvestorAccountPage;props.investorId=route.params.investorId}
 else if(route.path==='/investments/allocate')component=AllocationPage
 else if(route.path==='/investments/settings')component=SettingsPage
 else {component=MovementsPage;props.mode=route.path.endsWith('capital')?'capital':'payouts'}
 return h('main',{class:'p-3 sm:p-6'},[h('nav',{class:'flex flex-wrap gap-3 mb-5'},['investors','capital','allocate','payouts','settings'].map(p=>h('button',{onClick:()=>window.navigateTo('/investments/'+p)},p))),h(component,props)])
}})
for(const [name,component]of Object.entries({UButton,UCard,UInput,USelect,USelectMenu,UCheckbox,UFormGroup,UTextarea,UTable,UBadge,UAlert,UModal,InvestmentsProfileModal:ProfileModal,InvestmentsMovementModal:MovementModal,InvestmentsLedgerTable:LedgerTable}))app.component(name,component)
app.component('Icon',{props:['name'],setup:props=>()=>{const name=props.name.replace(/^i-heroicons-/,''),icon=heroicons.icons[name]||heroicons.icons['cube'];return h('svg',{viewBox:'0 0 '+(icon.width||heroicons.width)+' '+(icon.height||heroicons.height),width:'1em',height:'1em',innerHTML:icon.body})}})
app.component('NuxtLink',{props:{to:[String,Object],custom:Boolean,target:String},setup:(props,{slots})=>()=>{const href=typeof props.to==='string'?props.to:props.to?.path,navigate=e=>{e.preventDefault();window.navigateTo(props.to)};return props.custom?slots.default?.({route,href,isActive:false,isExactActive:false,isExternal:false,navigate}):h('a',{href,onClick:navigate},slots.default?.())}})
app.config.errorHandler=(error,_instance,info)=>{errors.push(info+': '+error.stack)}
app.mount('#app')
let stage='initial list'
const wait=async()=>{await nextTick();await new Promise(r=>setTimeout(r,50))}
const assert=(condition,message)=>{if(!condition)throw Error(message)}
async function until(fn,message){for(let i=0;i<150;i++){if(fn())return;await wait()}throw Error(message)}
const dialog=()=>[...document.querySelectorAll('[role=dialog]')].filter(d=>d.getClientRects().length).at(-1)
async function click(text){stage='Click '+text;const button=[...(dialog()||document).querySelectorAll('button,a')].find(b=>b.textContent.trim()===text);assert(button,'Control '+text);await until(()=>!button.disabled,'Enabled '+text);button.click();await wait()}
function field(label){const root=dialog()||document;const node=[...root.querySelectorAll('label')].find(l=>l.textContent.trim().replace(/\s*\*$/,'')===label);const input=node?.htmlFor?document.getElementById(node.htmlFor):null;assert(input,'Field '+label);return input}
async function fill(label,value){stage='Fill '+label;const input=field(label);input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));await wait()}

async function control(body){await fetch('/fixture-control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}
async function navigate(path){await window.navigateTo(path);await wait()}
try{

 const investorId=(await state()).investors[0].id;assert((await state()).events.length===0,'Adding investor does not post cash');

 async function buyShares(amount,price,date){await click('Buy shares');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Purchase form ready');await fill('Date',date);await fill('Price per share (INR)',String(price));await fill('Amount (INR)',String(amount));await fill('Payment status','PAID');await until(()=>dialog()?.textContent.includes('Shares bought:'),'Purchase preview ready');await click('Record purchase');await until(()=>!dialog(),'Purchase saved')}
 await buyShares(10000,100,'2026-01-02');await until(()=>document.body.textContent.includes('10%'),'First purchase ownership');await buyShares(12000,120,'2026-01-03');await until(()=>document.body.textContent.includes('20%'),'Second purchase at different price');
 await click('Redeem shares');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Redemption form ready');await fill('Date','2026-01-04');await fill('Price per share (INR)','150');await fill('Shares to redeem','201');await until(()=>!dialog()?.querySelector('fieldset').disabled,'Dated holdings loaded');assert(!field('Shares to redeem').checkValidity(),'Over-redemption rejected');await fill('Shares to redeem','50');await fill('Payment status','PAID');await until(()=>dialog()?.textContent.includes('7,500'),'Redemption payment calculated');await click('Record redemption');await until(()=>!dialog(),'Redemption saved');await until(()=>document.body.textContent.includes('15%'),'Remaining ownership updated');assert(document.body.textContent.includes('50 shares at 150 each'),'History shows trade quantity and price');
 let investor=(await request('GET','/investors')).data.find(p=>p.id===investorId);assert(investor.shares===150&&investor.capital===14500&&investor.profitPercent===15,'Shares and cash reconcile across prices');
 await navigate('/investments/allocate');await until(()=>document.body.textContent.includes('Calculate profit'),'Allocation ready');await fill('Period from','2026-01-05');await fill('Period to','2026-01-31');await click('Calculate profit');await until(()=>document.body.textContent.includes('Amount to share'),'Profit calculated');await fill('Amount to share (INR)','10000');await click('Preview all shares');await until(()=>document.body.textContent.includes("Review everyone's allocation"),'Allocation preview ready');assert(document.body.textContent.includes('1,500'),'Allocation uses remaining holding');await fill('Allocation date','2026-01-31');await click('Approve allocations for all investors');await until(()=>toasts.length>0,'Profit allocated');
 await navigate('/investments/investors/'+investorId);await until(()=>document.body.textContent.includes('Pay profit'),'Profile payout ready');
 for(const [date,amount] of [['2026-02-01','500'],['2026-02-02','1000']]){await click('Pay profit');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Payout ready');await fill('Date',date);await fill('Amount (INR)',amount);await click('Record payment');await until(()=>!dialog(),'Payout saved')}
 investor=(await request('GET','/investors')).data.find(p=>p.id===investorId);assert(investor.payable===0&&investor.paid===1500,'Partial/full payouts reconcile');
 await navigate('/investments/settings');await until(()=>[...document.querySelectorAll('button')].some(b=>b.textContent.trim()==='Save company shares'&&!b.disabled),'Settings ready');field('Include shares').click();await wait();await click('Save company shares');await until(()=>requests.some(r=>r.method==='PUT'&&r.path==='/investors/share-settings'&&r.body.includeShares===false),'Percentage mode saved');
 await navigate('/investments/investors');await until(()=>document.body.textContent.includes('Ravi'),'Directory ready');await click('Add investor');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Percentage profile ready');assert(!dialog().textContent.includes('Agreement'),'No agreement in percentage mode');await fill('Investor user','new');await fill('Name','Meera');await fill('Email','meera@example.test');await fill('Effective date','2026-02-01');await fill('Ownership %','10');await fill('Profit share %','7');await click('Save investor');await until(()=>!dialog(),'Percentage investor saved');await until(()=>document.body.textContent.includes('Meera'),'New row loaded');await click('Meera');await until(()=>document.body.textContent.includes('7%'),'Profile percentages shown');
 const meera=(await state()).investors.find(p=>p.name==='Meera');await click('Record capital movement');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Ordinary capital form ready');assert(!dialog().textContent.includes('Price per share'),'No price in percentage mode');await fill('Date','2026-02-02');await fill('Amount (INR)','1000');await click('Record movement');await until(()=>!dialog(),'Ordinary capital saved');
 await click('Edit profile');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Percentage editor ready');assert(Number(field('Profit share %').value)===7,'Edit shows current percentage');await fill('Effective date','2026-03-01');await fill('Profit share %','8');await click('Save investor');await until(()=>!dialog(),'Percentage changed on profile');await until(()=>document.body.textContent.includes('8%'),'Updated percentage shown');
 const saved=(await request('GET','/investors')).data.find(p=>p.id===meera.id);assert(saved.capital===1000&&saved.profitPercent===8&&saved.shares===0,'Percentage mode stays independent of capital');assert(!errors.length,errors.join('\n'));assert(document.documentElement.scrollWidth<=innerWidth+1,'Profile has no page-level horizontal overflow');
 // Confirmed cash and dues use one shared trade source in profile and Capital.
 await navigate('/investments/settings');await until(()=>[...document.querySelectorAll('button')].some(b=>b.textContent.trim()==='Save company shares'&&!b.disabled),'Settings ready again');field('Include shares').click();await wait();await click('Save company shares');await until(()=>requests.some(r=>r.method==='PUT'&&r.path==='/investors/share-settings'&&r.body.includeShares===true),'Shares re-enabled');
 await navigate('/investments/investors');await until(()=>document.body.textContent.includes('Ravi'),'Directory ready for due investor');await click('Add investor');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Due investor form');await fill('Investor user','new');await fill('Name','Nila');await fill('Email','nila@example.test');await fill('Effective date','2026-04-01');await click('Save investor');await until(()=>!dialog(),'Due investor saved');await until(()=>document.body.textContent.includes('Nila'),'Due investor row');await click('Nila');await until(()=>document.body.textContent.includes('Buy shares'),'Due investor profile');
 const nila=(await state()).investors.find(p=>p.name==='Nila');
 await click('Buy shares');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Unpaid purchase form');await fill('Date','2026-04-02');await fill('Price per share (INR)','100');await fill('Amount (INR)','10000');await fill('Payment status','DUE');assert(!dialog().textContent.includes('Cash / bank account'),'Unpaid transaction asks for no bank');await until(()=>dialog()?.textContent.includes('Remaining due:')&&dialog().textContent.includes('10,000'),'Unpaid preview');await click('Record purchase');await until(()=>!dialog(),'Unpaid purchase saved');await until(()=>document.body.textContent.includes('Receive payment'),'Purchase due action shown');
 let pending=(await request('GET','/investors')).data.find(p=>p.id===nila.id);assert(pending.shares===100&&pending.capital===0&&pending.shareCapitalDue===10000,'Unpaid purchase changes units without cash');
 await click('Receive payment');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled&&Number(field('Amount (INR)').value)===10000,'Profile settlement amount prefilled');assert(!dialog().textContent.includes('Price per share'),'Settlement never reprices shares');await fill('Date','2026-04-03');await fill('Amount (INR)','4000');await click('Record settlement');await until(()=>!dialog(),'Partial settlement saved');
 const purchaseDue=(await state()).events.find(e=>e.investor_id===nila.id&&e.kind==='SHARE_BUY');
 await navigate('/investments/capital');await until(()=>document.body.textContent.includes('Record capital movement'),'Capital page loaded');await click('Record capital movement');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Capital entry form ready');await fill('Entry type','SETTLE');await fill('Investor',nila.id);await fill('Date','2026-04-04');await until(()=>[...field('Share due').options].some(o=>o.value===purchaseDue.id),'Due available on Capital');await fill('Share due',purchaseDue.id);await until(()=>Number(field('Amount (INR)').value)===6000,'Remaining due prefilled on Capital');await click('Record settlement');await until(()=>!dialog(),'Capital settles due');
 await click('Record capital movement');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'New Capital share movement form');await fill('Investor',nila.id);await fill('Date','2026-04-05');await fill('Price per share (INR)','120');await fill('Amount (INR)','12000');await fill('Payment status','PARTIAL');await fill('Amount paid now (INR)','3000');await until(()=>dialog()?.textContent.includes('Remaining due:')&&dialog().textContent.includes('9,000'),'Partial paid trade preview');await click('Record purchase');await until(()=>!dialog(),'New share movement from Capital saved');
 await navigate('/investments/investors/'+nila.id);await until(()=>document.body.textContent.includes('20%'),'Capital trade updates profile holding');pending=(await request('GET','/investors')).data.find(p=>p.id===nila.id);assert(pending.shares===200&&pending.capital===13000&&pending.shareCapitalDue===9000,'Capital and profile share one source');
 await click('Redeem shares');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Unpaid redemption form');await fill('Date','2026-04-06');await fill('Price per share (INR)','150');await fill('Shares to redeem','50');await fill('Payment status','DUE');await click('Record redemption');await until(()=>!dialog(),'Unpaid redemption recorded');await until(()=>document.body.textContent.includes('Pay redemption due'),'Redemption payment action shown');pending=(await request('GET','/investors')).data.find(p=>p.id===nila.id);assert(pending.shares===150&&pending.capital===13000&&pending.shareRedemptionDue===7500&&pending.shareCapitalDue===9000,'Separate receivable and payable dues, no automatic netting');
 for(const [date,amount] of [['2026-04-07','2500'],['2026-04-08','5000']]){await click('Pay redemption due');await until(()=>dialog()?.querySelector('fieldset')&&!dialog().querySelector('fieldset').disabled,'Redemption settlement ready');await fill('Date',date);await fill('Amount (INR)',amount);await click('Record settlement');await until(()=>!dialog(),'Redemption payment saved')}
 pending=(await request('GET','/investors')).data.find(p=>p.id===nila.id);assert(pending.shares===150&&pending.capital===5500&&pending.shareRedemptionDue===0&&pending.shareCapitalDue===9000,'Redemption settles without changing shares again');
 assert(!errors.length,errors.join('\n'));assert(document.documentElement.scrollWidth<=innerWidth+1,'Dues and payment profile fits viewport');
 document.querySelector('#result').textContent='ALL PASSED: one-table directory; full-screen investor creation without agreements; variable-price purchases and redemption; holdings and transaction price history; profit allocation and partial/full payout; percentage settings, profile percentages and ordinary capital; paid/unpaid/partial confirmations; profile and Capital due settlements without duplicate shares; desktop/mobile layouts.'
}catch(error){document.querySelector('#result').textContent='FAILED at '+stage+': '+error.stack+'\n'+errors.join('\n')+'\nDialog: '+(dialog()?.textContent || '')}
</script></body></html>
